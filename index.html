<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>OFF-LEASH</title>
<meta name="description" content="A moody neon-night brawler roguelike — you are the monster, and you are DONE being collected.">
<meta name="theme-color" content="#1b1523">
<link rel="manifest" href="manifest.json?v=6">
<link rel="icon" href="assets/icons/icon.svg?v=6" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/main.css?v=6">
<script>
// hub-stats tracker v2
(function(){try{var A="offleash",K="hubdev",d=localStorage.getItem(K);if(!d){d=(self.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"."+Math.random().toString(36).slice(2));localStorage.setItem(K,d);}var u="https://hub-stats.mathiasjob.workers.dev/hit",R=(function(){try{var x=document.referrer;if(!x)return"";x=new URL(x);var h=location.host;if(x.host!==h)return x.host;if(/\.github\.io$/.test(h)){var s=x.pathname.split("/")[1]||"",m=location.pathname.split("/")[1]||"";return s===m?"self":h+"/"+s;}return"self";}catch(e){return""}})(),b=JSON.stringify({app:A,d:d,r:R});if(navigator.sendBeacon){navigator.sendBeacon(u,b);}else{fetch(u,{method:"POST",body:b,keepalive:true,mode:"no-cors"});}}catch(e){}})();
</script>
<script>
// boot watchdog: if the game hasn't rendered within 3.5s, nuke SW + caches once and reload
(function(){
  setTimeout(function(){
    if (window.__ol) return;
    if (sessionStorage.getItem('ol_rescued')) return;
    sessionStorage.setItem('ol_rescued', '1');
    Promise.all([
      'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}) : null,
      window.caches ? caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}) : null
    ]).then(function(){ location.reload(); });
  }, 3500);
})();
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="stickzone"></div>
<div id="stickbase"><div id="stickknob"></div></div>

<div id="buttons">
  <button class="btn small" id="ab1btn"><span class="lbl">◐</span><b class="cdnum"></b></button>
  <button class="btn small" id="ab2btn"><span class="lbl">⚟</span><b class="cdnum"></b></button>
  <button class="btn small" id="ab3btn"><span class="lbl">◎</span><b class="cdnum"></b></button>
  <button class="btn" id="dashbtn"><span class="lbl">DASH</span></button>
  <button class="btn" id="jumpbtn"><span class="lbl">JUMP</span></button>
  <button class="btn big" id="atkbtn"><span class="lbl">A</span></button>
</div>

<div id="hud">
  <div id="hpbar"><i id="hpfill"></i></div>
  <span id="runline"></span>
  <button id="mutebtn">♪</button>
</div>
<div id="toast"></div>
<div id="coach"></div>

<div id="title">
  <h1>OFF-LEASH</h1>
  <p>they collected you. collect yourself back.</p>
  <button id="startbtn">RUN</button>
  <span class="mstone">the escape · trainers, the keeper, and home</span>
</div>

<div class="overlay" id="den">
  <div class="panel wide">
    <h2 class="win">THE DEN</h2>
    <p id="densub" class="dim"></p>
    <div id="starterrow" class="choicerow"></div>
    <div id="denshop" class="choicerow"></div>
    <div id="denpursuit"></div>
    <div class="denbtns">
      <button id="beginbtn" class="bigbtn">BEGIN THE ESCAPE</button>
      <button id="gallerybtn" class="smallbtn">form gallery</button>
      <button id="densparbtn" class="smallbtn">sparring yard</button>
    </div>
  </div>
</div>

<div class="overlay" id="scene">
  <div class="panel">
    <h2 id="scenespeaker" class="win"></h2>
    <p id="sceneline"></p>
    <button id="scenenext" class="bigbtn">…</button>
    <button id="sceneskip" class="smallbtn" style="display:none">skip →</button>
  </div>
</div>

<div class="overlay" id="gallery">
  <div class="panel wide">
    <button id="galleryclose" class="closex">×</button>
    <h2>FORMS</h2>
    <p id="gallerysub" class="dim"></p>
    <div id="gallerygrid"></div>
  </div>
</div>

<div class="overlay" id="board">
  <div class="panel wide">
    <h2 id="boardact"></h2>
    <p id="boardsub" class="dim"></p>
    <div id="missions"></div>
    <button id="boardheal" class="smallbtn" style="display:none"></button>
    <button id="practicebtn" class="smallbtn">sparring yard</button>
  </div>
</div>

<div class="overlay" id="upgrade">
  <div class="panel">
    <h2>The fight taught you something.</h2>
    <div id="upchoices" class="choicerow"></div>
  </div>
</div>

<div class="overlay" id="evolve">
  <div class="panel">
    <h2 class="win">The essence stirs.</h2>
    <p class="dim">What you fought is what you become. Choose.</p>
    <div id="evochoices" class="choicerow"></div>
  </div>
</div>

<div class="overlay" id="defeat">
  <div class="panel">
    <h2>Caught.</h2>
    <p id="defcause"></p>
    <p id="defstats" class="dim"></p>
    <button id="againbtn" class="bigbtn">Run it back</button>
  </div>
</div>

<div class="overlay" id="victory">
  <div class="panel">
    <h2 class="win">OUT.</h2>
    <p id="winsub"></p>
    <button id="winbtn" class="bigbtn">Run it again</button>
  </div>
</div>

<div id="rotate"><span>📱</span>Turn your phone sideways — the night is wide.</div>

<script type="module" src="js/main.js?v=6"></script>
</body>
</html>
